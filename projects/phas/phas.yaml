Evidence:
  EMF 5:
    description: 33% chance to be EMF 5 per environment interaction. Hunts give random values, not reliable evidence!
    special: None
    img: emf5.svg
  D.O.T.S. Projector:
    description: Occasionally shows in D.O.T.S. when trying to enter a roaming state.
    img: dots.svg
  Ultraviolet:
    description: Valid surfaces will always produce a valid fingerprint by default.
    img: uv.svg
  Freezing Temperatures:
    description: Temperature only decreases when the ghost is within the same room.
    img: freezing.svg
  Ghost Orbs:
    description: A small floating orb in the ghosts favourite room. Must be seen through a video camera with night vision.
    img: orbs.svg
  Ghost Writing:
    description: Attempts to write every 45-90 seconds the ghost is within range. Chances to write increase with each book tier.
    img: writing.svg
  Spirit Box:
    description: The ghost has a chance to respond, with an increased chance for every tier. Lights must be off in the same room. See Equipment for valid questions.
    img: spirit.svg
