Tests:
  Equipment:
    Incense:
      Demon: Can hunt after 60s
      Moroi: Wanders for 50% longer during hunt
      Spirit: Can't hunt for 180s
      Yurei: Stays in room for 90s
    Parabolic:
      Banshee: 33% chance to wail
      Moroi: Curse
      Myling: More Often
    Salt:
      Gallu: Cannot step on when Enraged
      Wraith: Cannot step on, including hunt
    Crucifix:
      Demon: 50% larger range
      Onryo: Will use candles before Crucifix
    Ultraviolet:
      Obake: 6 Fingers(Doors), 2 Fingers(Light Switches), 5 Fingers(Keyboards, Cell Doors), Always evidence
    EMF:
      Jinn: EMF at breaker, breaker on
      Phantom: Roams to player, EMF 2 @ head height
      Wraith: Teleports to player, EMF 2 @ head height
    D.O.T.S.:
      Goryo: Always evidence
    Video Camera:
      Goryo: D.O.T.S. only on video
      Mimic: Always has fake orbs(including 0 evidence)
      Phantom: Will not appear in "Ghost" videos
    Spirit Box:
      Deogen: 33% chance to growl if within 1m from player, always evidence
      Moroi: Curse, Always evidence
    Camera:
      Phantom: Will not appear in "Ghost" photos
    Freezing:
      Hantu: Always evidence
    Ghost Orbs:
      Mimic: Always evidence, including 0 evidence
  Interactions:
    Events:
      Banshee: Singing more often
      Hantu: Breath visible, Breaker Off
      Kormos: No mist or chase events
      Mare: Light events more often
      Oni: No "Ghost Mist" event
      Shade: Inactive if multiple people are in the same room as it.
    Sanity:
      Banshee: Hunts based on targets sanity
      Jinn: Drops nearby player sanity 25%, EMF 2/5 @ breaker(On)
      Moroi: If cursed, 20% sanity drop. Can only be cursed once
      Oni: Events drain 2x
      Yurei: Door slam drops 15%
    Cursed Objects:
      Shade: May appear during summoning events
      Thaye: Age on Ouija Board will increase
    Room:
      Goryo: Will never change
    Activity:
      Oni: More activity when in the same room
      Poltergeist: Throws items frequently
      Shade: Inactive overall
      Thaye: Less activity the more it ages
      Twins: Multiple room interactions
    Breaker / Lights:
      Hantu: Cannot turn On
      Jinn: Cannot turn Off
      Mare: Cannot turn On light, May instantly turn off light
    Environment:
      Poltergeist: Strong throws
      Yurei: Closes door w/o Event
  Hunting:
    Behavior:
      Aswang: Ends @ hiding spots
      Banshee: Solo Target
      Deildegast: No LOS
      Kormos: Blind
      Mare: Favors dark rooms
      Myling: Quiet
      Obambo: Shorter when aggressive
      Poltergeist: Throws items rapidly
      Raiju: Increased hunt speed near player equipment
      Revenant: Fast with detected player, slow otherwise
      Yokai: Can't hear, Can't sense Electronics
    Appearance:
      Banshee: Female
      Dayan: Female
      Hantu: Breath Visible, Breaker Off
      Obake: Shapeshifts at least once
      Oni: More visible
      Phantom: Less visible


