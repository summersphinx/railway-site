Ghosts:
  Aswang:
    Strength: When they spot their target, Aswangs become faster in pursuit.
    Weakness: Aswangs prefer chasing over searching.
    Tips:
      - Impossible to die if hiding correctly.
      - May hunt with no grace period.
    Evidence:
      - D.O.T.S. Projector
      - Freezing Temperatures
      - Ghost Writing
    Speed:
      Base: 1.53
      Line-of-Sight: 2.52
    Hunt Start: .5
  Banshee:
    Strength: Focuses on 1 player until they are killed or left the game.
    Weakness: Cannot kill if the targeted player is not inside.
    Tips:
      - Frequently roams to target player outside of hunts.
      - 50% chance for long roams from favourite room.
      - Produces unique screams through Parabolic Microphone and Sound Recorder(See Audio).
      - 46.67% chance to sing per event.
      - Can only be female.
      - Hunts based on target's sanity.
    Evidence:
      - D.O.T.S. Projector
      - Ghost Orb
      - Ultraviolet
    Speed:
      Base: 1.7
    Hunt Start: .5
  Dayan:
    Strength: Moves quicker during hunts. Hunts sooner if a player is nearby.
    Weakness: Moves slower if nearby players are still.
    Tips:
      - Can only be female.
      - Speed is affected by the closest player, even if undetected.
    Evidence:
          - EMF 5
          - Ghost Orbs
          - Spirit Box
    Speed:
      Base: 1.7
      Line-of-Sight: 1.2(still)/2.25(walking)
    Hunt Start: .45(still)/.65(walking)
  Deildegast:
    Strength: Moves faster at the start of contracts.
    Weakness: Interacting with more objects slows down the ghost.
    Tips:
      - 10% chance to interact with doors and lights.
      - 85% chance to interact with props.
      - Starts with a base speed of 3m/s. This decreases with each unique interation point from a player by 0.1 a minimum of 0.4m/s.
      - The speed can not be affected during a hunt.
      - The speed resets to 3m/s after hunts. Unique items also get reset.
    Evidence:
          - EMF 5
          - Ghost Writing
          - D.O.T.S Projector
    Speed:
      Base: 0.4/3
      Line-of-Sight: 0.4/3
    Hunt Start: .5
  Demon:
    Strength: Short hunt cooldown. Hunts start sooner. Smudging less effective.
    Weakness: Larger crucifix range.
    Tips:
      - May start hunts regardless of sanity.
      - Crucifix ranges are 50% larger.
      - Smudging prevents hunts for 60 sec.
      - Hunt cooldown is 20 sec.
    Evidence:
          - Ultraviolet
          - Ghost Writing
          - Freezing Temperatures
    Speed:
      Base: 1.7
      Line-of-Sight: 1.7
    Hunt Start: .7
  Deogen:
    Strength: Always knows where players are. Faster with no line of sight.
    Weakness: Slows when near its target
    Tips:
      - 33% chance with spirit box to give unique sound if player is within 1m of the ghost.
      - 30% chance to interact with doors.
    Evidence:
      - Spirit Box
      - Ghost Writing
      - D.O.T.S. Projector
    Speed:
      Base: 6m
      Line-of-Sight: distance * 0.15/min 0.4
    Hunt Start: .4
  Gallu:
    Strength: Becomes more aggressive with more protective equipment.
    Weakness: Less aggressive after hunts.
    Tips:
      - Will not disturb salt while enraged.
      - Footprints will stay for 3 sec and total 6(normal 4).
    Evidence:
      - EMF 5
      - Spirit Box
      - Ultraviolet
    Speed:
      Base: 1.36/1.955/1.7
      Line-of-Sight: 1.36/1.955/1.7
    Hunt Start: .4/.5/.6
  Goryo:
    Strength: Only seen in D.O.T.S. with camera and no players nearby.
    Weakness: Unlikely to wander. Can not change favourite room.
    Tips:
      - Can only perform short roams.
      - D.O.T.S. will only be seen if players are not in the same room.
      - 67% chance to enter D.O.T.S. state after roaming.
    Evidence:
      - D.O.T.S Projector
      - EMF 5
      - Ultraviolet
    Speed:
      Base: 1.7
      Line-of-Sight: 1.7
    Hunt Start: .5
  Hantu:
    Strength: Moves quicker in colder environments.
    Weakness: Moves slower in warmer environments.
    Tips:
      - May emit breaths while hunting with the power off.
      - Can not turn on power.
    Evidence:
      - Ultraviolet
      - Ghost Orbs
      - Freezing Temperatures
    Speed:
      Base: 1.4-2.7
      Line-of-Sight: 1.4-2.7
    Hunt Start: .5
  Jinn:
    Strength: Faster when chasing players far away.
    Weakness: Can not use abilities when power is off.
    Tips:
      - Will drain a players sanity if it is in the same room or within 3m. If multiple players meet the criteria, the player chosen is based on join list.
      - Drain ability will drain sanity by 25%.
    Evidence:
      - EMF 5
      - Ultraviolet
      - Freezing Temperatures
    Speed:
      Base: 1.7
      Line-of-Sight: 1.7/2.5(>3m)
    Hunt Start: .5
  Kormos:
    Strength: Higher sanity threshold if players sprint in the same room.
    Weakness: Unable to see players that are still.
    Tips:
      - Not moving during a hunt guarantees the ghost can not kill you, unless it happens to run into you.
      - The ghost can not hear between floors.
    Evidence:
      - Ghost Orb
      - Spirit Box
      - Ultraviolet
    Speed:
      Base: 1.7
      Line-of-Sight: 2.21
    Hunt Start: .5/.7
  Mare:
    Strength: Higher sanity threshold in unlit rooms.
    Weakness: Lower sanity threshold in lit rooms.
    Tips:
      - Can not turn lights on.
      - Performs more light interactions.
      - Wanders more with more lights turned on.
      - 14% chance to immediately turn a light source off if it is within 4m with a max delay of 1 sec.
    Evidence:
      - Ghost Orb
      - Ghost Writing
      - Spirit Box
    Speed:
      Base:
      Line-of-Sight:
    Hunt Start:
  Moroi:
    Strength: Base speed increases with lower team sanity(+0.083m/s per 5% below threshold).
    Weakness: Using incense can not kill or see players for a longer duration.
    Tips:
      - Players who hear the ghost will get cursed, dropping their sanity by 25%.
      - Players can only get cursed once.
    Evidence:
      - Freezing Temperatures
      - Ghost Writing
      - Spirit Box
    Speed:
      Base: 1.5/2.25
      Line-of-Sight: 1.5/2.25
    Hunt Start: .5
  Myling:
    Strength: Quieter than other ghosts during hunts.
    Weakness: Produces paranormal sounds more frequently.
    Tips:
      - Produces a paranormal sound every 64-127 sec. Normal 80-127.
    Evidence:
          - EMF 5
          - Ultraviolet
          - Ghost Writing
    Speed:
      Base: 1.7
      Line-of-Sight: 1.7
    Hunt Start: .5
  Obake:
    Strength: Has a chance to not produce Ultraviolet Evidence.
    Weakness: Chance to leave unique evidence behind.
    Tips:
      - 16.7% chance to produce 6 finger handprints.
      - 16.7% chance to produce 2 fingerprints on light switches.
      - 16.7% chance to produce 5 fingerprints on keyboards and cell doors.
      - 25% to not leave Ultraviolet evidence.
      - Handprints may disappear twice as fast.
      - Will shapeshift every 6-8 sec during hunts.
    Evidence:
      - EMF 5
      - Ghost Orbs
      - Ultraviolet
    Speed:
      Base: 1.7
      Line-of-Sight: 1.7
    Hunt Start: .5
